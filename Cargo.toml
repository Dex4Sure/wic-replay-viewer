[package]
name = "wic-replay-viewer"
version = "0.6.3"
edition = "2024"
description = "Native replay library backend for the WiC Replay Viewer"
authors = ["Dex4Sure"]
license = "MIT"
publish = false

[dependencies]
flate2 = "=1.1.10"
rayon = "=1.12.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
wic_replay_parser = { path = "parser/rust_parser", default-features = false, features = ["serde"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 1
strip = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[workspace]
members = ["parser/rust_parser", "src-tauri"]
