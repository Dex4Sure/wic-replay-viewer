name: Build desktop artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Never let two builds for the same ref race each other onto one draft release.
concurrency:
  group: build-desktop-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap, fast preconditions gate the expensive builds. The portable quality
  # gate is not repeated here: it already ran on main for this exact commit, so
  # this job verifies that result before starting any package build.
  verify-release:
    name: Verify release preconditions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Verify release tag contract
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          npm run version:check -- --tag "$RELEASE_TAG"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - name: Require successful quality checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs?head_sha=$GITHUB_SHA&per_page=100")
          run_id=$(jq -r '
            [.workflow_runs[] | select(.conclusion == "success")][0].id // empty
          ' <<<"$runs")
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful Portable quality run exists for $GITHUB_SHA." >&2
            exit 1
          fi
          jobs=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")
          jq -e '
            any(.jobs[]; .name == "Portable checks" and .conclusion == "success") and
            any(.jobs[];
              .name == "Rust checks" and
              (.conclusion == "success" or .conclusion == "skipped")
            )
          ' <<<"$jobs" >/dev/null || {
            echo "::error::Portable quality lacks an acceptable portable or Rust job for $GITHUB_SHA." >&2
            exit 1
          }
          echo "Portable quality succeeded and its conditional Rust job was accepted for $GITHUB_SHA."

  linux-appimage:
    name: Linux x64 AppImage
    needs: verify-release
    # Build on the oldest supported base to keep the glibc requirement bounded.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Verify pinned Rust toolchain
        run: rustc --version --verbose
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential curl file libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            patchelf wget libfuse2
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build AppImage
        run: npm run build:appimage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-symbols-linux-${{ github.sha }}
          path: artifacts/diagnostic-symbols
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wic-replay-viewer-linux-appimage
          path: artifacts/WiCReplayViewer-linux-x86_64.AppImage
          if-no-files-found: error

  windows-portable:
    name: Windows x64 portable
    needs: verify-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Verify pinned Rust toolchain
        run: rustc --version --verbose
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build portable application
        run: npm run build:windows
      - name: Package portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Force -Path target/release/wic-replay-viewer.exe, LICENSE, NOTICE.txt, THIRD_PARTY_NOTICES.txt -DestinationPath artifacts/WiCReplayViewer-windows-x64-portable.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-symbols-windows-${{ github.sha }}
          path: |
            target/release/wic_replay_viewer.pdb
            artifacts/diagnostic-symbols
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wic-replay-viewer-windows-x64-portable
          path: artifacts/WiCReplayViewer-windows-x64-portable.zip
          if-no-files-found: error

  draft-release:
    name: Create draft GitHub Release
    needs: [linux-appimage, windows-portable]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wic-replay-viewer-*
          path: release-assets
          merge-multiple: true
      - name: Verify release tag still targets the built commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags --force origin "refs/tags/$RELEASE_TAG"
          tag_commit=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Release tag no longer targets the commit that produced these artifacts." >&2
            exit 1
          fi
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run --silent release:notes > release-notes.md
          assets=(
            release-assets/WiCReplayViewer-linux-x86_64.AppImage
            release-assets/WiCReplayViewer-windows-x64-portable.zip
          )
          if is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$is_draft" != true ]]; then
              echo "Refusing to replace assets on published release $GITHUB_REF_NAME." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --draft \
              --notes-file release-notes.md \
              --title "WiC Replay Viewer ${GITHUB_REF_NAME#v}" \
              --verify-tag
          fi
          while IFS= read -r asset_name; do
            case "$asset_name" in
              WiCReplayViewer-linux-x86_64.AppImage) ;;
              WiCReplayViewer-windows-x64-portable.zip) ;;
              *) gh release delete-asset "$GITHUB_REF_NAME" "$asset_name" --yes ;;
            esac
          done < <(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          actual_assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | sort)
          expected_assets=$(printf '%s\n' \
            WiCReplayViewer-linux-x86_64.AppImage \
            WiCReplayViewer-windows-x64-portable.zip | sort)
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "Draft release assets do not match the current build." >&2
            exit 1
          fi
