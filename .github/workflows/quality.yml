name: Portable quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Supersede in-flight pull request runs only. Runs on main must survive a later
# push because `Build desktop artifacts` requires a successful run for the exact
# commit a release tag points at.
concurrency:
  group: portable-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The Rust half needs the system WebKit packages and a ~900 MB Cargo target
  # cache, which together cost more than every other check combined. Most pushes
  # touch no Rust at all, so decide per commit whether it has to run. This also
  # covers a bypassed local hook: CI still verifies whatever actually changed.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base=${BASE:-$BEFORE}
          # A new branch, a force push, or a missing base leaves nothing to
          # compare against. Run everything rather than guess.
          if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]] \
            || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo 'rust=true' >> "$GITHUB_OUTPUT"
            echo 'No usable base commit; running the Rust gate.'
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$GITHUB_SHA")
          printf '%s\n' "$changed"
          if grep -qE '(\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^scripts/(quality|coverage)\.sh$|^\.github/workflows/quality\.yml$)' <<<"$changed"; then
            echo 'rust=true' >> "$GITHUB_OUTPUT"
          else
            echo 'rust=false' >> "$GITHUB_OUTPUT"
          fi

  portable:
    name: Portable checks
    needs: changes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: |
            parser/requirements-dev.txt
            research/requirements-dev.txt
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache
          key: frontend-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            frontend-tools-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # This half needs Cargo only for `cargo fmt` and `cargo fetch`, so it skips
      # both the WebKit packages and the target cache the Rust half restores.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-
      - name: Install locked quality dependencies
        run: python -m pip install --requirement research/requirements-dev.txt
      - name: Run portable half of the quality gate
        run: ./scripts/quality.sh ci-portable

  rust:
    name: Rust checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          # v1 starts a clean cache after the old coverage-oriented entry became
          # an immutable exact hit that could never absorb Clippy/test outputs.
          prefix-key: v1-rust
          shared-key: portable-quality
          # Rust changes are comparatively infrequent here, while linking the
          # Tauri workspace crates is most of this job's warm-run time.
          cache-workspace-crates: true
          # Only main writes this cache. GitHub scopes caches per ref, so a save
          # from a pull request ref is unreadable by any later run.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify pinned Rust toolchain
        run: |
          rustc --version --verbose
          cargo --version
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget
      - name: Run Rust half of the quality gate
        run: ./scripts/quality.sh ci-rust
